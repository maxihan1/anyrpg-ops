<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영자 로그인 | AnyRPG</title>
<link rel="stylesheet" href="/assets/style.css">
<script type="module" src="/assets/login.js"></script>
</head>
<body>
<main>
<form class="card login-box form" id="login-form" novalidate>
<div><h1>AnyRPG 게임 운영</h1><p class="muted">운영자 계정으로 로그인하세요. 게임 계정으로는 들어올 수 없습니다.</p></div>
<div class="form-row"><label for="login-id">아이디</label><input type="text" id="login-id" autocomplete="username" required></div>
<div class="form-row"><label for="login-pw">비밀번호</label><input type="password" id="login-pw" autocomplete="current-password" required></div>
<p class="error-text" id="login-error" role="alert" hidden></p>
<button type="submit" class="btn primary block">로그인</button>
</form>
</main>
</body>
</html>
